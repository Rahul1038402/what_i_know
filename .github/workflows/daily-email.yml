name: Daily knowledge email

on:
  schedule:
    - cron: '30 1 * * *'  # 07:00 IST (UTC + 5:30)
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write           # needed to commit metadata back

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r cron-job/requirements.txt

      - name: Send daily email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KNOWLEDGE_DIR: monorepo
          LLM_ENABLED: 'true'
          # LLM_MODEL: llama-3.3-70b-versatile  # default; uncomment to override
        run: python cron-job/scripts/send_daily.py

      - name: Commit metadata updates
        run: |
          git config user.name "knowledge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monorepo/
          git diff --staged --quiet || git commit -m "chore: update review metadata [skip ci]"
          git push